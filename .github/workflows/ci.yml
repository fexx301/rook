name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Run Clippy
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo +stable test --locked --all-targets --all-features

      - name: Build release binary
        run: cargo +stable build --locked --release --all-features

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked --version 0.22.2

      - name: Scan locked dependencies
        run: cargo +stable audit --deny warnings
